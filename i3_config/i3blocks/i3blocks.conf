# i3blocks configuration
# This file is a copy of /etc/i3blocks.conf with customizations

[general]
interval=5
separator=true
separator_block_width=15

[greeting]
command=echo "Welcome back!"
interval=once
color=#a8a3c1

[disk]
command=$HOME/.config/scripts/disk
LABEL=Disk
DIR=$HOME
ALERT_LOW=10
interval=30

[memory]
command=$HOME/.config/scripts/memory
label=Mem
interval=30

[cpu_usage]
command=top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{printf "%.0f%%", 100 - $1}'
label=CPU
interval=5

[load_average]
command=cat /proc/loadavg | awk '{printf "%.2f %.2f %.2f", $1, $2, $3}'
label=LOAD
interval=30

[volume]
command=$HOME/.config/scripts/volume
LABEL=Vol
interval=1
signal=10

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1
color=#a8a3c1

[spotify]
label=Spotify
command=$HOME/.config/scripts/spotify.py
color=#81b71a
interval=5
